- id: hollow.square
  name: Village Square
  short: the square
  long: |
    Packed earth, a dry well, and the sergeant's bench under a plane tree.
    The lane runs east toward the trees. A cottage door faces south.
  x: 0
  y: 0
  z: 0
  flags: [outdoor, lit]
  npcs: [hollow.bram]
  exits:
    east:
      to: hollow.lane
    south:
      to: hollow.cottage

- id: hollow.lane
  name: East Lane
  short: the lane
  long: |
    A cart track between low walls. Someone left a sword, a cloak,
    and a lantern where the grass starts.
  x: 1
  y: 0
  z: 0
  flags: [outdoor]
  items: [hollow.sword, hollow.cloak, hollow.lantern]
  exits:
    west:
      to: hollow.square
    north:
      to: hollow.thicket

- id: hollow.thicket
  name: Thicket
  short: the thicket
  long: |
    Hazel and thorn. The path north is a darker green. Something glints
    if you already know to look.
  x: 1
  y: 1
  z: 0
  flags: [outdoor]
  npcs: [hollow.wolf, hollow.wolf-2]
  items: [hollow.ring]
  exits:
    south:
      to: hollow.lane
    north:
      to: hollow.camp

- id: hollow.camp
  name: Brigand Camp
  short: the camp
  long: |
    A dead fire and a stolen pot. The thicket closes in behind you.
  x: 1
  y: 2
  z: 0
  flags: [outdoor]
  npcs: [hollow.brigand]
  exits:
    south:
      to: hollow.thicket

- id: hollow.cottage
  name: Cottage
  short: the cottage
  long: |
    A single room and a cold hearth. The window looks onto the square.
  x: 0
  y: -1
  z: 0
  flags: [windowed]
  exits:
    north:
      to: hollow.square
