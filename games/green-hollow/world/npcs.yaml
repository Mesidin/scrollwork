- id: hollow.bram
  keywords: [bram, sergeant, trainer, soldier]
  name: Sergeant Bram
  short: Sergeant Bram
  long: Grey at the temples. He watches your feet more than your face.
  trainer: true
  topics:
    train: "Say train and the skill. Footwork, melee, notice. Coin on the bench."
    wolf: "Two of them in the thicket. The camp north of that is worse."
    ring: "If you see silver in the thorn, it was not left for the wolves."
  ai:
    profile: sentinel

