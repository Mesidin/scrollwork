- id: hollow.bram
  keywords: [bram, sergeant, trainer, soldier]
  name: Sergeant Bram
  short: Sergeant Bram
  long: Grey at the temples. He watches your feet more than your face.
  trainer: true
  repairer: true
  shop:
    currency: coin
    purse: 30
    max_purse: 100
    dynamic: true
  topics:
    train: "Say train and the skill. Footwork, melee, notice, crafting. Coin on the bench."
    repair: "Keep your steel sharp and your leather sound. I can mend what gets battered."
    crafting: "Whittling a good cudgel takes patience and a sharp eye. Mind the grain of the oak."
    cudgel: "A heavy hardwood branch from the thicket makes a sturdy cudgel if shaped right."
    bank: "The village strongbox sits in the cottage south of the square. Store your extra coin there so the wolves don't get it."
    wolf: "Two of them in the thicket. The camp north of that is worse."
    ring: "If you see silver in the thorn, it was not left for the wolves."
  teach_recipes:
    crafting: craft_cudgel
    cudgel: craft_cudgel
  ai:
    profile: sentinel

- id: hollow.wolf
  keywords: [wolf, dog]
  name: grey wolf
  short: a grey wolf
  long: Ribs and teeth. It is already moving.
  xp: 8
  attrs:
    body: 1
  skills:
    melee: 1
  oppose:
    hit: 8
    escape: 7
  ai:
    profile: aggressive
    wander: true
    wander_every: 12
    pursue: true
    rooms: [hollow.thicket, hollow.camp]
  combat:
    round_speed: 4
    attacks:
      - name: bite
        damage: 1d4
        skill: melee
        hit: "The {Name} tore into you with a ravenous bite."
        miss: "The {Name} snapped and missed."
        hit_room: "The {Name} tore into {name} with a ravenous bite."
        miss_room: "The {Name} snapped at {name} and missed."
  resources:
    vigor:
      current: 10
      max: 10
  loot:
    - item: hollow.pelt
      skin_only: true
      chance: 100
      count: 1

