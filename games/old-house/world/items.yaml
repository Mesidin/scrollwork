- id: house.lamp
  keywords: [lamp, lantern, light]
  name: brass lamp
  short: a brass lamp
  long: A dented oil lamp. The wick still looks willing.
  takeable: true
  use:
    toggle_flag: light
    message: You light the lamp. Warm light pools around your feet.
    message_off: You douse the lamp. The dark leans in.

- id: house.coat
  keywords: [coat, overcoat]
  name: wool coat
  short: a heavy wool coat
  long: Moth-eaten but thick. It would keep the cellar chill off.
  takeable: true
  wearable: true
  slot: body
  armor:
    soak: 1
  mods:
    escape: 1
  value: 4

- id: house.knife
  keywords: [knife, blade]
  name: kitchen knife
  short: a kitchen knife
  long: The edge is dull but it is still a pointy stick with manners.
  takeable: true
  wearable: true
  slot: wield
  weapon:
    damage: 1d6+1
    verb: stab
  value: 3

- id: house.cellar-key
  keywords: [key, brass, cellar]
  name: brass key
  short: a small brass key
  long: The tag on the ring is faded, but you can still make out CELLAR.
  takeable: true
